<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="styles.css" />
    <script src="session.js"></script>
    <script src="theme.js"></script>
  </head>
  <body>
    <header class="page-header">
<div class="brand-wrap"><picture><source srcset="assets/kepler282c_logo.webp" type="image/webp"/><img class="brand-logo" src="assets/kepler282c_logo.png" alt="Kepler 282C" loading="lazy" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;1024&quot; height=&quot;256&quot; viewBox=&quot;0 0 1024 256&quot;><defs><linearGradient id=&quot;g&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;1&quot; y2=&quot;0&quot;><stop stop-color=&quot;%233ef3ff&quot;/><stop offset=&quot;1&quot; stop-color=&quot;%238e5bff&quot;/></linearGradient></defs><rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;transparent&quot;/><text x=&quot;50%&quot; y=&quot;55%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;UnifrakturCook, IM Fell English, serif&quot; font-size=&quot;120&quot; fill=&quot;url(%23g)&quot; stroke=&quot;%23000&quot; stroke-width=&quot;3&quot;>KEPLER 282C</text></svg>';"/></picture></div>
      <h1>Kepler 282C — Creación de Personaje</h1>
      <p class="subtitle">Elige una opción para continuar.</p>
    </header>

    <main>
      <section class="menu-section" aria-labelledby="menu-title">
        <h2 id="menu-title" class="sr-only">Menú principal</h2>
        <div class="menu-grid">
          <button id="menu-new" class="menu-card">
            <h3>Nuevo personaje</h3>
            <p>Comenzar desde cero: raza, atributos, tiradas y virtudes.</p>
          </button>
          <button id="menu-edit" class="menu-card">
            <h3>Modificar guardado</h3>
            <p>Selecciona un personaje guardado y re-asigna solo sus Virtudes.</p>
          </button>
          <button id="menu-export" class="menu-card">
            <h3>Exportar guardado</h3>
            <p>Descarga un archivo de texto con el resumen del personaje.</p>
          </button>
        </div>

        <div id="saved-panel" class="saved-panel" hidden>
          <h3 id="saved-title">Selecciona un personaje</h3>
          <div id="saved-list" class="saved-list"></div>
          <div class="actions-bar">
            <button id="saved-cancel" class="back-btn" style="position:static">Cancelar</button>
            <button id="saved-continue" class="continue-btn" disabled>Continuar</button>
          </div>
        </div>
      </section>
    </main>

    <script src="virtudes_data.js"></script>
    <script src="virtudes_generales_data.js"></script>
    <script src="dotes_data.js"></script>
    <script src="menu.js" defer></script>
  </body>
</html>
