<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="styles.css" />
    <script src="session.js"></script>
    <script src="theme.js"></script>
  </head>
  <body>
    <header class="page-header">
<div class="brand-wrap"><picture><source srcset="assets/kepler282c_logo.webp" type="image/webp"/><img class="brand-logo" src="assets/kepler282c_logo.png" alt="Kepler 282C" loading="lazy" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;1024&quot; height=&quot;256&quot; viewBox=&quot;0 0 1024 256&quot;><defs><linearGradient id=&quot;g&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;1&quot; y2=&quot;0&quot;><stop stop-color=&quot;%233ef3ff&quot;/><stop offset=&quot;1&quot; stop-color=&quot;%238e5bff&quot;/></linearGradient></defs><rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;transparent&quot;/><text x=&quot;50%&quot; y=&quot;55%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;UnifrakturCook, IM Fell English, serif&quot; font-size=&quot;120&quot; fill=&quot;url(%23g)&quot; stroke=&quot;%23000&quot; stroke-width=&quot;3&quot;>KEPLER 282C</text></svg>';"/></picture></div>
      <button id="back-btn" class="back-btn" aria-label="Volver atrás">Atrás</button>
      <h1>Resumen de Tiradas (Nivel 1)</h1>
      <p class="subtitle">Resumen final de tu personaje. Aquí puedes revisar todos tus valores, guardar tu personaje o exportarlo.</p>
    </header>

    <main>
      <section aria-labelledby="sum-title">
        <h2 id="sum-title" class="sr-only">Cálculos</h2>
        <div id="race-banner" class="selection-bar">
          <div>
            <div id="race-picked">Raza: —</div>
            <div id="attrs-picked" style="color:var(--muted)">Atributos: —</div>
          </div>
          <a href="atributos.html" class="continue-btn" style="text-decoration:none; text-align:center">Cambiar +1</a>
        </div>

        <div id="calc-grid" class="race-grid" aria-label="Tiradas derivadas">
          <!-- tarjetas generadas por JS -->
        </div>

        <div class="selection-bar" style="margin-top:20px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap">
          <span style="color:var(--muted)">Revisa todos tus valores finales y guarda o exporta tu personaje.</span>
          <div style="display:flex; gap:10px; flex-wrap:wrap">
            <button id="export-btn" class="continue-btn">Exportar</button>
            <button id="save-btn" class="continue-btn">Guardar</button>
          </div>
        </div>
      </section>
    </main>

    <script src="virtudes_data.js"></script>
    <script src="virtudes_generales_data.js"></script>
    <script src="dotes_data.js"></script>
    <script src="resumen.js" defer></script>
  </body>
</html>
